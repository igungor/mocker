name: CI

on:
  # Every base, so stacked pull requests are tested too.
  pull_request:
  push:
    branches: [main]

# A new push to a pull request cancels its previous run instead of holding one
# of the few macOS runners.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Build & Test
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Swift version
        id: swift
        run: echo "hash=$(swift --version 2>&1 | shasum -a 256 | cut -c1-16)" >> "$GITHUB_OUTPUT"

      # Fetching and compiling the dependencies is most of a cold build. Only main
      # saves a cache, so it follows main and pull requests don't fill the 10 GB.
      - name: Restore build cache
        uses: actions/cache/restore@v4
        with:
          path: .build
          key: build-${{ runner.os }}-${{ steps.swift.outputs.hash }}-${{ github.sha }}
          restore-keys: build-${{ runner.os }}-${{ steps.swift.outputs.hash }}-

      - name: Build
        run: swift build --build-tests

      - name: Test
        run: swift test --skip-build

      - name: Save build cache
        if: github.event_name == 'push'
        uses: actions/cache/save@v4
        with:
          path: .build
          key: build-${{ runner.os }}-${{ steps.swift.outputs.hash }}-${{ github.sha }}
